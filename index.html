<!<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"
    "http://www.w3.org/TR/html4/strict.dtd">
    <html>
    <head>
        <style>

            @media(mix-width : 600px) {
                #cont {
                    background: blue;
                    width: 100%;
                }
            }

            body {
                position: relative;
                margin: 0;
                height: 100vh;
            }


            #cont {
                border: none;
                width: 100%;
                min-height:;
                height: 80vh;
                text-align: center;
                margin: 20px auto;
                margin-bottom: auto;
                margin-top: auto;
                left: 10px;
            }

            button {
                border-radius: 5px;
                margin: 10px;
                width: 30%;
                padding: 5px 20px;
                cursor: pointer;
                border: none;
                font-weight: bold;
                font-size: 2rem;
                font-family: Trebuchet MS;
                transition: 0.5s ease background;
            }

            button:hover {
                background: #640;
            }

            textarea {
                overflow-x: scroll;
                border: solid grey 2px;
                min-height: 700px;
                width: 100%;
                font-size: 1.8em;
                height: 500px;
                color: #7e7e7e;
                background: transparent;
                background: #2e2e2e;
            }

            textarea.active {
                border: none;
            }

            iframe {
                background: #FFFFFF;
                width: 100%;
                height: 460px;
            }

            #head {
                display: flex;
                justify-content: center;
                gap: 0;
                background: #2e2e4e;
                place-items: center;
                border-radius: 5px;
                padding: 0px;
            }

            #head h1 {
                font-weight: bold;
                font-family: Courier New;
                font-size: 2rem;
                color:#0018FF;
                margin-right: 10px;


            }

            #inputs {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 0;
            }
            
            #about{
                background: Yellow;
                top:0;
                left:0;
                position:fixed;
                height: 50vh;
                width: 40%;
            }
            
            #about p {
                text-transform: uppercase;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div id="cont">
            <div id="head">
                <h1>BON</h1>
                <h2>HTML IDE</h2>
            </div>
            <div>
                <button id="runb">run</button><button id="bacb">back</button><button id="dow">download</button>
            </div>
            <div id="inputs">
                <textarea id="code" placeholder="html code here"></textarea>
                <textarea id="code" placeholder="css code here"></textarea>
                <textarea id="code" placeholder="js code here"></textarea>

            </div>
            
        </div>
        
         <div id="about">
                <img src="nan.jpg" alt="BON PIC"/>
                <p><b>Bonsu Alexander Kwakye Jnr </b>I am a junior<br>web developer.And I am creating this online <br>html , css and js IDE to help in developing your <br>
                Front-end skills.And Also You can download the <br>
                file if you want to.</p>
            </div>

        <script>
            let code = document.getElementById("code");
            let comp = document.createElement("iframe");
            let main = document.getElementById("cont");
            let runButton = document.getElementById("runb");
            let bButton = document.getElementById("bacb");

            let atIDE = false;

            function run () {
                comp.srcdoc = code.value;

            }

            runButton.addEventListener("click", ()=> {
                main.removeChild(code);
                main.appendChild(comp);

                atIDE = true;


            })

            bButton.addEventListener("click", ()=> {
                main.removeChild(comp);
                main.appendChild(code);
            })


            code.addEventListener("input", run);

            run ();
        </script>
    </body>
</html>
